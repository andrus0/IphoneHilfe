# nginx im iphonehilfe-Container (statisch, öffentlich per Tailscale Funnel)
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    autoindex off;

    # Sicherheitsheader server-weit. location-Blöcke setzen bewusst KEIN add_header
    # (das würde diese Header dort überschreiben); Cache-Steuerung läuft über expires.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Gesperrt (404): versteckte Pfade (.git, .claude, .DS_Store ...), Deploy-Skripte, Doku, Compose-Datei
    location ~ /\. { return 404; }
    location ~* ^/(deploy|docs)(/|$) { return 404; }
    location ~* \.(md|yml|yaml|sh)$ { return 404; }

    # Healthcheck fuer docker-compose
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Seite und Service Worker nie aus dem Cache: Updates kommen sofort an
    location = / { expires -1; }
    location = /index.html { expires -1; }
    location = /sw.js { expires -1; }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires 1h;
    }

    # Rest kurz cachen (Offline übernimmt der Service Worker)
    location / {
        expires 1h;
    }
}
