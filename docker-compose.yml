# IphoneHilfe: statische Seite, ausgeliefert von nginx im Container
services:
  iphonehilfe:
    image: nginx:1.27-alpine
    container_name: iphonehilfe
    restart: unless-stopped
    ports:
      - "${IPHONEHILFE_PORT:-8085}:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3
